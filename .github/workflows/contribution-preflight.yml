name: 'Contribution preflight #1002'
permissions:
  contents: read
concurrency:
  group: contribution-preflight-1002
  cancel-in-progress: false
jobs:
  validate-dispatch:
    name: Validate dispatched SHA
    runs-on: ubuntu-latest
    steps:
    - name: Check expected SHA
      env:
        EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      run: "if [ -n \"$EXPECTED_HEAD_SHA\" ] && [ \"$GITHUB_SHA\" != \"$EXPECTED_HEAD_SHA\"\
        \ ]; then\n  echo \"::error::Workflow SHA ${GITHUB_SHA} does not match expected\
        \ ${EXPECTED_HEAD_SHA}.\"\n  exit 1\nfi\necho \"Dispatch target SHA validated.\"\
        \n"
  test-config:
    name: Test Config (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: validate-dispatch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: fc42e0486e89b8b5dab713dae3f0b5606958cf76
    - name: Verify tested contribution SHA
      run: 'test "$(git rev-parse HEAD)" = "fc42e0486e89b8b5dab713dae3f0b5606958cf76"

        echo "Tested SHA: fc42e0486e89b8b5dab713dae3f0b5606958cf76; baseline: ca1d5e6531e46b76366010422c9f636e7d596caa"'
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: latest
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install data-designer-config only
      run: uv sync --package data-designer-config
    - name: Run config tests
      run: "uv run --with pytest --with pytest-asyncio --with pytest-env \\\n  pytest\
        \ packages/data-designer-config/tests\n"
  test-engine:
    name: Test Engine (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: validate-dispatch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: fc42e0486e89b8b5dab713dae3f0b5606958cf76
    - name: Verify tested contribution SHA
      run: 'test "$(git rev-parse HEAD)" = "fc42e0486e89b8b5dab713dae3f0b5606958cf76"

        echo "Tested SHA: fc42e0486e89b8b5dab713dae3f0b5606958cf76; baseline: ca1d5e6531e46b76366010422c9f636e7d596caa"'
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: latest
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install data-designer-engine only
      run: uv sync --package data-designer-engine
    - name: Run engine tests
      run: "uv run --with pytest --with pytest-asyncio --with pytest-httpx --with\
        \ pytest-env \\\n  pytest packages/data-designer-engine/tests\n"
  test-interface:
    name: Test Interface (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: validate-dispatch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: fc42e0486e89b8b5dab713dae3f0b5606958cf76
    - name: Verify tested contribution SHA
      run: 'test "$(git rev-parse HEAD)" = "fc42e0486e89b8b5dab713dae3f0b5606958cf76"

        echo "Tested SHA: fc42e0486e89b8b5dab713dae3f0b5606958cf76; baseline: ca1d5e6531e46b76366010422c9f636e7d596caa"'
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: latest
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Copy README to data-designer package
      run: cp README.md packages/data-designer/README.md
    - name: Install data-designer (full package)
      run: uv sync --package data-designer
    - name: Run interface tests
      run: "uv run --with pytest --with pytest-asyncio --with pytest-httpx --with\
        \ pytest-env \\\n  pytest packages/data-designer/tests\n"
  coverage:
    name: Coverage Check (Python ${{ matrix.python-version }})
    needs: validate-dispatch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: fc42e0486e89b8b5dab713dae3f0b5606958cf76
    - name: Verify tested contribution SHA
      run: 'test "$(git rev-parse HEAD)" = "fc42e0486e89b8b5dab713dae3f0b5606958cf76"

        echo "Tested SHA: fc42e0486e89b8b5dab713dae3f0b5606958cf76; baseline: ca1d5e6531e46b76366010422c9f636e7d596caa"'
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: latest
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install all packages
      run: make install-dev
    - name: Run tests with coverage
      run: "uv run --group dev pytest \\\n  packages/data-designer-config/tests \\\
        \n  packages/data-designer-engine/tests \\\n  packages/data-designer/tests\
        \ \\\n  --cov=data_designer \\\n  --cov-report=term-missing \\\n  --cov-report=xml\
        \ \\\n  --cov-fail-under=90\n"
  test-e2e:
    name: End to end test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: validate-dispatch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: fc42e0486e89b8b5dab713dae3f0b5606958cf76
    - name: Verify tested contribution SHA
      run: 'test "$(git rev-parse HEAD)" = "fc42e0486e89b8b5dab713dae3f0b5606958cf76"

        echo "Tested SHA: fc42e0486e89b8b5dab713dae3f0b5606958cf76; baseline: ca1d5e6531e46b76366010422c9f636e7d596caa"'
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: latest
        python-version: ${{ matrix.python-version }}
        enable-cache: false
    - name: Run e2e tests
      run: make test-e2e
  lint:
    name: Lint and Format Check
    needs: validate-dispatch
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: fc42e0486e89b8b5dab713dae3f0b5606958cf76
    - name: Verify tested contribution SHA
      run: 'test "$(git rev-parse HEAD)" = "fc42e0486e89b8b5dab713dae3f0b5606958cf76"

        echo "Tested SHA: fc42e0486e89b8b5dab713dae3f0b5606958cf76; baseline: ca1d5e6531e46b76366010422c9f636e7d596caa"'
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: latest
        python-version: '3.11'
        enable-cache: true
    - name: Install dependencies
      run: make install-dev
    - name: Check formatting
      run: make format-check
    - name: Run linter
      run: make lint
    - name: Test Graphify compatibility
      run: make test-graphify
  license-headers:
    name: Check License Headers
    needs: validate-dispatch
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: fc42e0486e89b8b5dab713dae3f0b5606958cf76
    - name: Verify tested contribution SHA
      run: 'test "$(git rev-parse HEAD)" = "fc42e0486e89b8b5dab713dae3f0b5606958cf76"

        echo "Tested SHA: fc42e0486e89b8b5dab713dae3f0b5606958cf76; baseline: ca1d5e6531e46b76366010422c9f636e7d596caa"'
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: latest
        python-version: '3.11'
        enable-cache: true
    - name: Install dependencies
      run: make install-dev
    - name: Check license headers
      run: make check-license-headers
  dependency-licenses:
    name: Check Dependency Licenses (Python ${{ matrix.python-version }})
    needs: validate-dispatch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: fc42e0486e89b8b5dab713dae3f0b5606958cf76
    - name: Verify tested contribution SHA
      run: 'test "$(git rev-parse HEAD)" = "fc42e0486e89b8b5dab713dae3f0b5606958cf76"

        echo "Tested SHA: fc42e0486e89b8b5dab713dae3f0b5606958cf76; baseline: ca1d5e6531e46b76366010422c9f636e7d596caa"'
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: latest
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Check dependency licenses
      run: make check-dependency-licenses LICENSE_PYTHON_VERSION=${{ matrix.python-version
        }}
  test-summary:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ubuntu-latest
    needs:
    - validate-dispatch
    - test-config
    - test-engine
    - test-interface
    if: always()
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - name: Check all tests passed
      run: "if [[ \"${{ needs.validate-dispatch.result }}\" != \"success\" ]] || \\\
        \n   [[ \"${{ needs.test-config.result }}\" != \"success\" ]] || \\\n   [[\
        \ \"${{ needs.test-engine.result }}\" != \"success\" ]] || \\\n   [[ \"${{\
        \ needs.test-interface.result }}\" != \"success\" ]]; then\n  echo \"One or\
        \ more test jobs failed\"\n  echo \"validate-dispatch: ${{ needs.validate-dispatch.result\
        \ }}\"\n  echo \"test-config: ${{ needs.test-config.result }}\"\n  echo \"\
        test-engine: ${{ needs.test-engine.result }}\"\n  echo \"test-interface: ${{\
        \ needs.test-interface.result }}\"\n  exit 1\nfi\necho \"All test jobs passed\
        \ successfully\"\n"
  fern-docs:
    name: Fern authoring and published-archive validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: fc42e0486e89b8b5dab713dae3f0b5606958cf76
        path: source
    - name: Verify tested contribution SHA
      working-directory: source
      run: 'test "$(git rev-parse HEAD)" = "fc42e0486e89b8b5dab713dae3f0b5606958cf76"

        echo "Tested SHA: fc42e0486e89b8b5dab713dae3f0b5606958cf76; baseline: ca1d5e6531e46b76366010422c9f636e7d596caa"'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: NVIDIA-NeMo/DataDesigner
        ref: 91b6eeacb8b6d239cef781cc536547430725f49f
        path: preview
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.9.5
        python-version: '3.11'
    - name: Install docs dependencies
      working-directory: source
      run: uv sync --all-packages --group docs
    - name: Check authoring docs
      working-directory: source
      run: make check-fern-docs
    - name: Prepare published archive
      run: python3 source/fern/scripts/fern-published-branch.py sync-source --source-root
        "$GITHUB_WORKSPACE/source" --published-root "$GITHUB_WORKSPACE/preview"
    - name: Check docs against published archive
      working-directory: preview
      run: make check-fern-docs DOCS_PYTHON="$GITHUB_WORKSPACE/source/.venv/bin/python"
        DOCS_JUPYTEXT="$GITHUB_WORKSPACE/source/.venv/bin/jupytext"
'on':
  push:
    branches:
    - codex/preflight-docs-1002
